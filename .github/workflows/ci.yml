name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Checkstyle, build, test & coverage (JaCoCo)
        run: mvn -B verify

      - name: Smoke test (file-server + file-client)
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh
        env:
          # On failure, smoke-test.sh copies its working dir (server.log,
          # client.log, files, ...) here; uploaded as an artifact below.
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-logs/
          if-no-files-found: ignore

      - name: Smoke test (file-client vs file-server 2.2.0 in docker)
        run: |
          chmod +x file-client/smoke-test.sh
          file-client/smoke-test.sh
        env:
          # On failure, smoke-test.sh copies its working dir (client.log, curl.err,
          # files, ...) + the file-server container log here; uploaded below.
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs-file-client

      - name: Upload file-client smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-file-client
          path: smoke-logs-file-client/
          if-no-files-found: ignore

      - name: Smoke test (file-server vs file-client 2.2.0 in docker)
        # The inverse of the previous step: runs the file-server built from this repo
        # locally and drives it with a released file-client 2.2.0 (docker).
        # Note: file-server/smoke-test.sh reuses the shaded file-server jar the
        # `mvn -B verify` step above already built, so it does not rebuild the server.
        #
        # Linux-only: the released file-client runs in docker with `network_mode: host` so
        # it reaches the host server at localhost:8443. That is required (not just a
        # convenience): the released client's mTLS rejects any other hostname and its
        # hostname verification can't be disabled via the released jar's config, so
        # localhost (matching the server cert's CN=localhost) is the only working path.
        # network_mode: host is unsupported on Docker Desktop for Windows/macOS, so this
        # step is skipped there (it still runs on every CI/Linux runner).
        if: runner.os == 'Linux'
        run: |
          chmod +x file-server/smoke-test.sh
          file-server/smoke-test.sh
        env:
          # On failure, smoke-test.sh copies its working dir (server.log, curl.err,
          # files, ...) + the file-client container log here; uploaded below.
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs-file-server

      - name: Upload file-server smoke test logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-file-server
          path: smoke-logs-file-server/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
