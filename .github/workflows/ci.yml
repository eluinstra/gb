name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Checkstyle, build, test & coverage (JaCoCo)
        run: mvn -B verify

      - name: Smoke test (file-server + file-client)
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh
        env:
          # On failure, smoke-test.sh copies its working dir (server.log,
          # client.log, files, ...) here; uploaded as an artifact below.
          SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-logs/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
